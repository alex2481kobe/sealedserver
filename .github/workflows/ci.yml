name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-service/go.mod
          cache: false

      - name: Test Go service
        working-directory: apps/go-service
        run: go test ./...

  php:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint PHP files
        run: find apps/php-sqlite-app -name '*.php' -type f -exec php -l {} \;

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check scripts
        run: |
          find scripts -name '*.sh' -type f -exec sh -n {} \;
          sh -n ops/appctl
