; PHP-FPM pool for one app, running as the app's own user.
;
; Install to /etc/php/8.3/fpm/pool.d/example.conf and replace example.
; nginx connects through the socket; the app reads its env file itself.

[example]
user = example
group = example

listen = /run/php/example.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s

env[APP_ENV_FILE] = /etc/example/example.env

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/example/php-error.log
