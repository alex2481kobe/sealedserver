# Shared http-level settings for Cloudflare Tunnel mode.
#
# Install to /etc/nginx/conf.d/tunnel.conf. The site configs depend on it.
#
# Every request reaches nginx from cloudflared on 127.0.0.1, so $remote_addr is
# the same for all visitors. Cloudflare sends the visitor address in
# CF-Connecting-IP. nginx listens on 127.0.0.1 only, so nothing outside the
# server can set that header directly.

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

limit_req_zone $client_ip zone=per_ip:10m rate=30r/s;
limit_req_status 429;

server_tokens off;
