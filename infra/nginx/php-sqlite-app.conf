# Static files plus a PHP + SQLite API behind Cloudflare Tunnel.
#
# Install to /etc/nginx/sites-available/example.conf and link it into
# sites-enabled. Replace app.example.com, /var/www/example and the socket.
# Needs tunnel.conf in /etc/nginx/conf.d/ and the app's PHP-FPM pool.

server {
    listen 127.0.0.1:8080;
    server_name app.example.com;

    root /var/www/example/public;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    limit_req zone=per_ip burst=60 nodelay;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/example.sock;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        expires 5m;
    }
}
