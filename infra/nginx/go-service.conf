# Go service behind Cloudflare Tunnel, including websocket upgrades.
#
# Install to /etc/nginx/sites-available/example.conf and link it into
# sites-enabled. Replace api.example.com and the local port.
# Needs tunnel.conf in /etc/nginx/conf.d/.

server {
    listen 127.0.0.1:8080;
    server_name api.example.com;

    limit_req zone=per_ip burst=60 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admin routes are reached over an SSH tunnel, never through the tunnel.
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
