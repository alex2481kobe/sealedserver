# Example Cloudflare Tunnel config for a shared no-inbound server.
#
# All public hostnames route to one local nginx listener.
# nginx dispatches by server_name.

tunnel: first-server-tunnel-id
credentials-file: /etc/cloudflared/first-server-tunnel-id.json

ingress:
  - hostname: static.example.com
    service: http://127.0.0.1:8080
  - hostname: www.static.example.com
    service: http://127.0.0.1:8080
  - hostname: app.example.com
    service: http://127.0.0.1:8080
  - hostname: game.example.com
    service: http://127.0.0.1:8080
  - service: http_status:404
